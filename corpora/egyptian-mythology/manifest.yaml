id: egyptian-mythology
name: "Egyptian Mythology"
language: en
sources:
  - type: web_scrape
    tool: crawl4ai
    seed_urls:
      - "https://sacred-texts.com/egy/ebod/index.htm"
      - "https://en.wikipedia.org/wiki/Book_of_the_Dead"
      - "https://en.wikipedia.org/wiki/Pyramid_Texts"
      - "https://en.wikipedia.org/wiki/Ancient_Egyptian_funerary_texts"
  - type: search_augmented
    tool: tavily
    queries:
      - "Osiris Isis Set Horus myth primary sources Book of the Dead"
      - "Duat weighing of the heart Ma'at Anubis primary text"
      - "Ra Apep sun barge underworld journey Egyptian mythology"
      - "Pyramid Texts Unas spells afterlife Egyptian"
extraction:
  prompt_override: extraction_prompt.md
  node_type_hints: ["Character", "Place", "Object", "Event", "Concept"]
narrative_style:
  tone: "reverent, mythic narrator, not academic"
  length_seconds: 180
voice:
  provider: elevenlabs
  voice_id: "${GRAPHODYSSEE_DEFAULT_VOICE_ID}"
relation_types:
  - CHILD_OF
  - SPOUSE_OF
  - FOUGHT
  - MET
  - TOOK_PLACE_AT
  - WORSHIPPED_AS
  - GUARDS
  - TRANSFORMED_INTO
  - RULER_OF
  - ASSOCIATED_WITH
license_note: "Sacred Texts Archive public-domain translations; Wikipedia CC-BY-SA. Cite source per-passage."
